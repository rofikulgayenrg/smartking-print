<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART KING - স্ক্যান ও প্রিন্ট</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f0f4f8; padding: 15px; display: flex; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .shop-header { text-align: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 15px; margin-bottom: 15px; }
    .shop-header h2 { color: #0d47a1; font-size: 22px; font-weight: bold; }
    .shop-header p { color: #555; font-size: 13px; margin-top: 4px; }
    .shop-header .contact { display: inline-block; margin-top: 6px; background: #e3f2fd; color: #0d47a1; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }
    .price-box { background: #f8fafc; border: 1.5px solid #0d47a1; border-radius: 10px; padding: 12px; text-align: center; margin: 15px 0; }
    .price-box span { font-size: 14px; color: #475569; }
    .price-box h3 { font-size: 24px; color: #0d47a1; margin-top: 2px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; text-decoration: none; }
    .btn-upi { background: #0d47a1; color: #fff; }
    .btn-cash { background: #16a34a; color: #fff; }
    .status-msg { display: none; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; margin-top: 10px; }
    .success { background: #dcfce7; color: #166534; display: block; }
    
    /* পেমেন্ট অপশন পপ-আপ (QR কোড ও ডাইরেক্ট অ্যাপ) */
    .qr-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 999; }
    .qr-content { background: white; padding: 20px; border-radius: 16px; text-align: center; width: 90%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .qr-content img { width: 180px; height: 180px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 8px; }
    .btn-direct-app { background: #2563eb; color: white; padding: 11px; width: 100%; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-done { background: #16a34a; color: white; padding: 11px; width: 100%; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn-cancel { background: #64748b; color: white; padding: 8px; width: 100%; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; margin-top: 8px; cursor: pointer; }
    .divider { display: flex; align-items: center; text-align: center; margin: 10px 0; color: #94a3b8; font-size: 12px; font-weight: bold; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
  </style>
</head>
<body>

<div class="card">
  <div class="shop-header">
    <h2 id="shopNameDisplay">টেলিকম সাইবার ক্যাফ</h2>
    <p id="shopAddressDisplay">চোরগেড়িয়া, সিহড়, কোতুলপুর, বাঁকুড়া, পশ্চিমবঙ্গ</p>
    <div class="contact" id="shopPhoneDisplay">📞 যোগাযোগ: 7718489405</div>
  </div>

  <div class="form-group">
    <label>আপনার নাম (Customer Name):</label>
    <input type="text" id="custName" placeholder="যেমন: রহিম / অমিত">
  </div>

  <div class="form-group">
    <label>ফাইল সিলেক্ট করুন (PDF বা ছবি):</label>
    <input type="file" id="fileInput" accept="image/*,.pdf" onchange="calculateTotal()">
  </div>

  <div class="row">
    <div class="col form-group">
      <label>প্রিন্ট টাইপ:</label>
      <select id="printType" onchange="calculateTotal()">
        <option value="bw" id="bwOpt">B&W (ব্ল্যাক) - ₹৫</option>
        <option value="color" id="colorOpt">কালার (Color) - ₹১০</option>
      </select>
    </div>
    <div class="col form-group">
      <label>কপি সংখ্যা:</label>
      <input type="number" id="copies" value="1" min="1" onchange="calculateTotal()" oninput="calculateTotal()" style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px;">
    </div>
  </div>

  <div class="price-box">
    <span>মোট প্রদেয় টাকা</span>
    <h3 id="totalDisplay">₹৫</h3>
  </div>

  <button class="btn btn-upi" id="btnUpi" onclick="openPaymentModal()">
    💳 অনলাইন পেমেন্ট (QR কোড / UPI অ্যাপ)
  </button>
  <button class="btn btn-cash" id="btnCash" onclick="processPayment('CASH')">
    💵 কাউন্টারে ক্যাশ পেমেন্ট দিন
  </button>

  <div id="statusBox" class="status-msg"></div>
</div>

<!-- অনলাইন পেমেন্ট পপ-আপ: QR কোড + ডাইরেক্ট UPI অ্যাপ -->
<div id="paymentModal" class="qr-modal">
  <div class="qr-content">
    <h3 style="color:#0d47a1; font-size:16px;">অনলাইন পেমেন্ট করুন</h3>
    <p id="modalAmountText" style="font-size:14px; font-weight:bold; margin-top:4px; color:#16a34a;">প্রদেয় টাকা: ₹৫</p>
    
    <!-- ১ নম্বর বিকল্প: QR কোড স্ক্যান -->
    <img id="qrImg" src="" alt="UPI QR Code">
    <p style="font-size:11px; color:#64748b;">(GPay, PhonePe বা Paytm দিয়ে QR স্ক্যান করুন)</p>

    <div class="divider">অথবা</div>

    <!-- ২ নম্বর বিকল্প: সরাসরি UPI অ্যাপ ওপেন -->
    <button class="btn-direct-app" onclick="payViaDirectUpi()">
      📱 সরাসরি UPI অ্যাপে পে করুন (PhonePe/GPay)
    </button>

    <!-- কনফার্ম ও বাতিল বাটন -->
    <button class="btn-done" onclick="confirmPaymentAndUpload()">
      ✅ পেমেন্ট সম্পন্ন হয়েছে (ফাইল পাঠান)
    </button>
    <button class="btn-cancel" onclick="closePaymentModal()">বাতিল করুন</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDNTxPFKCLAHa2IcfhMDNbYX_CeFdbQupg",
    authDomain: "smartking-print.firebaseapp.com",
    databaseURL: "https://smartking-print-default-rtdb.firebaseio.com",
    projectId: "smartking-print",
    storageBucket: "smartking-print.firebasestorage.app",
    messagingSenderId: "946237333884",
    appId: "1:946237333884:web:a88bcda0e140ef591404f9",
    measurementId: "G-N4K72TDSLZ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let upiId = "7718489405@ybl";
  let currentBwRate = 5;
  let currentColorRate = 10;
  let currentUpiLink = "";

  db.ref("shopProfile").on("value", (snap) => {
    const data = snap.val();
    if(data) {
      if(data.name) document.getElementById("shopNameDisplay").innerText = data.name;
      if(data.address) document.getElementById("shopAddressDisplay").innerText = data.address;
      if(data.phone) document.getElementById("shopPhoneDisplay").innerText = "📞 যোগাযোগ: " + data.phone;
      if(data.upi) upiId = data.upi;
      if(data.bwRate) currentBwRate = parseInt(data.bwRate);
      if(data.colorRate) currentColorRate = parseInt(data.colorRate);

      document.getElementById("bwOpt").innerText = `B&W (ব্ল্যাক) - ₹${currentBwRate}`;
      document.getElementById("colorOpt").innerText = `কালার (Color) - ₹${currentColorRate}`;
      calculateTotal();
    }
  });

  function calculateTotal() {
    const type = document.getElementById("printType").value;
    const copies = parseInt(document.getElementById("copies").value) || 1;
    const rate = type === "bw" ? currentBwRate : currentColorRate;
    const total = rate * copies;
    document.getElementById("totalDisplay").innerText = "₹" + total;
    return total;
  }

  function openPaymentModal() {
    const file = document.getElementById("fileInput").files[0];
    if(!file) { alert("অনুগ্রহ করে প্রথমে ফাইল সিলেক্ট করুন!"); return; }
    
    const amount = calculateTotal();
    const name = document.getElementById("custName").value.trim() || "Customer";
    
    // Direct UPI লিঙ্ক এবং QR কোড তৈরি
    currentUpiLink = `upi://pay?pa=${upiId}&pn=TelecomCyberCafe&am=${amount}&cu=INR&tn=Print-${name}`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(currentUpiLink)}`;
    
    document.getElementById("qrImg").src = qrUrl;
    document.getElementById("modalAmountText").innerText = `প্রদেয় টাকা: ₹${amount}`;
    document.getElementById("paymentModal").style.display = "flex";
  }

  function closePaymentModal() {
    document.getElementById("paymentModal").style.display = "none";
  }

  function payViaDirectUpi() {
    if(currentUpiLink) {
      window.location.href = currentUpiLink;
    }
  }

  function confirmPaymentAndUpload() {
    closePaymentModal();
    processPayment('ONLINE');
  }

  function processPayment(mode) {
    const file = document.getElementById("fileInput").files[0];
    const name = document.getElementById("custName").value.trim() || "Customer";
    if(!file) { alert("অনুগ্রহ করে ফাইল সিলেক্ট করুন!"); return; }

    const amount = calculateTotal();
    const copies = document.getElementById("copies").value;
    const printType = document.getElementById("printType").value;

    uploadToShop(file, name, amount, copies, printType, mode);
  }

  function uploadToShop(file, name, amount, copies, printType, mode) {
    const statusBox = document.getElementById("statusBox");
    statusBox.style.display = "block";
    statusBox.innerText = "ফাইল দোকানে পাঠানো হচ্ছে, অপেক্ষা করুন...";

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;
      const orderRef = db.ref("printQueue").push();
      orderRef.set({
        customerName: name,
        fileName: file.name,
        fileData: base64Data,
        copies: copies,
        printType: printType === 'bw' ? 'Black & White' : 'Colour',
        amount: amount,
        paymentStatus: mode === 'ONLINE' ? 'ONLINE PAID' : 'CASH UNPAID',
        timestamp: Date.now()
      }).then(() => {
        statusBox.className = "status-msg success";
        statusBox.innerHTML = "✅ ফাইল সফলভাবে দোকানে পৌঁছেছে!<br>কাউন্টারে প্রিন্ট সংগ্রহ করুন।";
        document.getElementById("fileInput").value = "";
      }).catch((err) => {
        alert("ত্রুটি: " + err.message);
      });
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
